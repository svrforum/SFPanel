services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - HOMEPAGE_ALLOWED_HOSTS=*
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - homepage-config:/app/config

volumes:
  homepage-config:
