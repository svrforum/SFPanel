services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    restart: unless-stopped
    ports:
      - "${PORT:-4533}:4533"
    environment:
      - ND_LOGLEVEL=info
    volumes:
      - navidrome-data:/data
      - navidrome-music:/music

volumes:
  navidrome-data:
  navidrome-music:
