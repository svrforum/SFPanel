services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
    volumes:
      - sabnzbd-config:/config
      - sabnzbd-downloads:/downloads
      - sabnzbd-incomplete:/incomplete-downloads

volumes:
  sabnzbd-config:
  sabnzbd-downloads:
  sabnzbd-incomplete:
