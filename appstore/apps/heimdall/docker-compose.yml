services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
    ports:
      - "${PORT:-8090}:80"
    volumes:
      - heimdall-config:/config

volumes:
  heimdall-config:
