services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    restart: unless-stopped
    ports:
      - "${PORT:-8083}:8083"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
    volumes:
      - calibre-web-config:/config
      - calibre-web-books:/books

volumes:
  calibre-web-config:
  calibre-web-books:
