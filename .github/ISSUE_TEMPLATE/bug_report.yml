name: 🐛 Bug report
description: Report a problem with SFPanel
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For **security vulnerabilities**, do not use this form — see [SECURITY.md](https://github.com/svrforum/SFPanel/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SFPanel version
      description: Output of `sfpanel version`.
      placeholder: "v0.x.y"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / install method
      placeholder: "Ubuntu 24.04, curl|bash install"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: e.g. `journalctl -u sfpanel -n 100`. Please redact secrets/IPs.
      render: shell
