name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

# Shared group with release-desktop so the two tag-triggered release workflows
# serialize instead of racing to create/attach assets on the same Release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign v2 for the legacy .sig/.pem artifacts: already-deployed
          # panels (≤ v0.55.0) verify self-updates against those files and
          # cosign v3 is bundle-only. Legacy publishing is kept indefinitely;
          # the cosign v3 step below additionally publishes the standardized
          # .sigstore.json bundle that v0.56+ verifiers prefer.
          cosign-release: 'v2.6.5'

      - name: Sign checksums.txt with cosign keyless
        run: |
          cd dist
          cosign sign-blob --yes \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem \
            checksums.txt
          gh release upload "${TAG_NAME}" checksums.txt.sig checksums.txt.pem --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

      - name: Install cosign v3 (bundle signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # v3 emits the standardized Sigstore bundle. Installed into its own
          # directory and invoked by absolute path so the v2 binary used by
          # the legacy signing step above is never shadowed, regardless of the
          # PATH order the two installer runs produce.
          cosign-release: 'v3.1.3'
          install-dir: ${{ runner.temp }}/cosign3

      - name: Sign checksums.txt as a Sigstore bundle (cosign v3)
        run: |
          cd dist
          "${RUNNER_TEMP}/cosign3/cosign" sign-blob --yes \
            --bundle checksums.txt.sigstore.json \
            checksums.txt

      - name: Smoke-verify the bundle with the in-binary verifier
        # The bundle unit tests build their fixtures from the same field model
        # the verifier parses, so a drift between that model and real cosign
        # output would pass every unit test and only fail on deployed panels.
        # Verifying the just-produced bundle with the shipped verifier breaks
        # that loop before the asset is published.
        run: |
          SFPANEL_BUNDLE_SMOKE_BLOB="$PWD/dist/checksums.txt" \
          SFPANEL_BUNDLE_SMOKE_BUNDLE="$PWD/dist/checksums.txt.sigstore.json" \
            go test ./internal/release/ -run TestVerifyRealBundleFromEnv -count=1 -v

      - name: Upload the Sigstore bundle
        run: |
          gh release upload "${TAG_NAME}" dist/checksums.txt.sigstore.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
