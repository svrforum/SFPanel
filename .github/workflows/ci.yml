name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt the Node.js-based actions onto Node 24 before GitHub flips the default
# in 2026-06. No untrusted input is injected anywhere in this workflow.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Least privilege: CI only reads the repo. Release/signing permissions live in
# the release workflows, not here.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push sequence doesn't queue
# redundant CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Read the version from go.mod so CI never drifts behind a dep
          # bump that raises the minimum Go toolchain.
          go-version-file: go.mod
          cache: true
      # cmd/sfpanel imports the root package, whose `//go:embed all:web/dist`
      # and `//go:embed web/dist/index.html` fail to compile until web/dist
      # exists. This job tests ./cmd and ./internal (not the root's SPA
      # serving), so a stub index.html is enough to let the embed compile —
      # cheaper than a full `npm run build` here. Explicit package list
      # rather than ./... since web/node_modules ships a stray Go package.
      - run: mkdir -p web/dist && echo '<!doctype html><title>ci-stub</title>' > web/dist/index.html
      - run: go test ./cmd/... ./internal/... -v -count=1

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Read the version from go.mod so CI never drifts behind a dep
          # bump that raises the minimum Go toolchain.
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Read from .nvmrc so every frontend build (here + release workflows)
          # uses the same Node, and a single bump moves them all.
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # Pin to a v2.x release built against Go 1.25.x. The 'latest' tag
          # on the v6 action resolved to a v1.x binary built with Go 1.24,
          # which refused to load against go.mod's go 1.25.0 directive.
          version: v2.12.1
      - name: errcheck (scoped — security/state packages)
        # errcheck stays off in the main config (best-effort `_ =` is heavy
        # repo-wide), but dropped errors on state-mutating calls in the
        # cluster/api/auth/db packages are a correctness/security risk, so
        # run errcheck against just those with a dedicated config.
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          version: v2.12.1
          args: -c .golangci-errcheck.yml ./internal/cluster/... ./internal/api/... ./internal/feature/auth/... ./internal/db/...

  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Read the version from go.mod so CI never drifts behind a dep
          # bump that raises the minimum Go toolchain.
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - run: go build -o sfpanel ./cmd/sfpanel

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      # Frontend lint failures used to be silently swallowed via "|| true".
      # Removing the guard so a lint regression actually breaks CI.
      - run: cd web && npm run lint
      - run: cd web && npm run build

  # Boots a throwaway panel (temp-dir DB, default port 3628) and runs the
  # single-node Playwright specs against it. The 2-node cluster specs and the
  # disruptive init→disband test self-skip without their env vars, but the
  # spec list below keeps the selection explicit anyway.
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Read the version from go.mod so CI never drifts behind a dep
          # bump that raises the minimum Go toolchain.
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: cd web && npm ci && npm run build
      - run: go build -o sfpanel ./cmd/sfpanel
      - name: Boot throwaway panel
        run: |
          E2E_DIR="$(mktemp -d)"
          echo "E2E_DIR=$E2E_DIR" >> "$GITHUB_ENV"
          # jwt_secret pre-set (>=32 chars) so config.Load() doesn't need to
          # generate-and-persist one; DB lives and dies with the runner.
          cat > "$E2E_DIR/config.yaml" <<EOF
          server:
            port: 3628
          database:
            path: $E2E_DIR/sfpanel.db
          auth:
            jwt_secret: $(openssl rand -hex 32)
          EOF
          # The binary refuses to start as non-root (system management needs
          # apt/disk/docker privileges); hosted runners have passwordless sudo.
          sudo ./sfpanel "$E2E_DIR/config.yaml" > "$E2E_DIR/panel.log" 2>&1 &
          echo "PANEL_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3628/api/v1/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "panel did not become healthy within 30s"
          cat "$E2E_DIR/panel.log"
          exit 1
      # Seed the admin via the CSRF-exempt bootstrap endpoint. The seeded
      # account must have NO TOTP — the specs' login helper can't answer a
      # 2FA challenge (see e2e/README.md).
      - name: Seed admin account
        run: |
          curl -fsS -X POST http://localhost:3628/api/v1/auth/setup \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"TestPass123!"}' >/dev/null
      - run: cd e2e && npm ci
      - run: cd e2e && npx playwright install chromium --with-deps
      - name: Run single-node specs
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3628
        run: |
          cd e2e && npx playwright test \
            tests/connect-port.spec.ts \
            tests/sidebar-banner.spec.ts \
            tests/tuning-categories.spec.ts \
            tests/cluster-lifecycle.spec.ts
      - name: Dump panel log on failure
        if: failure()
        run: cat "$E2E_DIR/panel.log" || true
      - name: Stop panel
        if: always()
        # PANEL_PID is the sudo wrapper; sudo forwards SIGTERM to the panel.
        run: sudo kill "$PANEL_PID" 2>/dev/null || true

  # Catch reachable CVEs in the Go stdlib/modules and high-severity advisories
  # in the production frontend deps — the gate that would have caught the
  # toolchain drift behind the recent stdlib CVEs.
  vuln-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck (Go stdlib + modules)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # The root package embeds web/dist; a stub lets the embed compile.
          mkdir -p web/dist && echo '<!doctype html><title>ci-stub</title>' > web/dist/index.html
          out=$("$(go env GOPATH)/bin/govulncheck" -show verbose ./cmd/... ./internal/... || true)
          echo "$out"
          # The github.com/docker/docker advisories currently have no upstream
          # fix (govulncheck: "Fixed in: N/A"). Acknowledge those, but fail on
          # any OTHER affected module so genuinely-fixable vulns still gate.
          if echo "$out" | grep -E '^[[:space:]]+Module:' | grep -qv 'github.com/docker/docker'; then
            echo "::error::govulncheck found a fixable vulnerability outside docker/docker"
            exit 1
          fi
          echo "OK: only the known unfixable docker/docker advisories remain."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: npm audit (production deps, high+)
        run: cd web && npm ci && npm audit --omit=dev --audit-level=high
