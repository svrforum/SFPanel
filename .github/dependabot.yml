version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/desktop"
    schedule:
      interval: weekly
  # Keeps the SHA-pinned actions in the workflows fresh.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
