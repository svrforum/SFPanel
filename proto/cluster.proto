syntax = "proto3";
package sfpanel.cluster;
option go_package = "github.com/svrforum/SFPanel/internal/cluster/proto";

service ClusterService {
    rpc PreFlight(PreFlightRequest) returns (PreFlightResponse);
    rpc Join(JoinRequest) returns (JoinResponse);
    rpc Leave(LeaveRequest) returns (LeaveResponse);
    // A manager's heartbeat to the leader. Managers only.
    rpc Heartbeat(stream HeartbeatPing) returns (stream HeartbeatPong);
    rpc ProxyRequest(APIRequest) returns (APIResponse);
    rpc GetMetrics(MetricsRequest) returns (MetricsResponse);
    rpc Subscribe(SubscribeRequest) returns (stream ClusterEvent);
    // An agent asks the leader to register it. Unauthenticated, like Join: the
    // agent has no certificate yet. The token, the CA pin checked by the agent
    // and the CSR are what bind it.
    rpc RegisterAgent(RegisterAgentRequest) returns (RegisterAgentResponse);
    // An agent reports its panel's CA so managers can reach its panel over
    // HTTPS. The node is the caller's certificate CN, never a request field.
    rpc ReportPanelCA(ReportPanelCARequest) returns (ReportPanelCAResponse);
    // An agent's heartbeat to the leader. A method of its own, so a manager
    // from before agents never takes an agent's ping for a manager's: it
    // answers this one Unimplemented, where its Heartbeat makes every node
    // that pings it a Raft voter.
    rpc AgentHeartbeat(stream HeartbeatPing) returns (stream HeartbeatPong);
}

message PreFlightRequest {
    string token = 1;
}

message PreFlightResponse {
    bool   valid = 1;
    string error = 2;
    string cluster_name = 3;
    int32  node_count = 4;
    int32  max_nodes = 5;
    // DER SubjectPublicKeyInfo of the cluster CA, sent whatever the token.
    // The joiner asks with no token, compares its SHA-256 with the
    // fingerprint in the join command, and sends the token only over a
    // connection that verifies the leader's certificate against it.
    bytes  ca_public_key = 6;
}

message JoinRequest {
    string token = 1;
    string node_id = 2;
    string node_name = 3;
    string api_address = 4;
    string grpc_address = 5;
    bytes  tls_cert = 6;
    // What the joining node's code supports. A cluster with agents takes no
    // manager whose code predates them (agents-v1).
    repeated string capabilities = 7;
}

message JoinResponse {
    bool   success = 1;
    string error = 2;
    string cluster_name = 3;
    bytes  ca_cert = 4;
    bytes  node_cert = 5;
    bytes  node_key = 6;
    repeated NodeInfo peers = 7;
    string jwt_secret = 8;
    string admin_username = 9;
    string admin_password_hash = 10;
    bool   raft_tls = 11;
    // TOTP secret of the admin account on the leader, so the joining node's
    // local DB is in sync before the FSM replication catches up. Empty if
    // the admin account doesn't have 2FA enabled.
    string admin_totp_secret = 12;
}

message LeaveRequest {
    string node_id = 1;
}

message LeaveResponse {
    bool   success = 1;
    string error = 2;
}

message HeartbeatPing {
    string node_id = 1;
    double cpu_percent = 2;
    double memory_percent = 3;
    int32  container_count = 4;
    int64  timestamp = 5;
    double disk_percent = 6;
    string version = 7;
    // What this node's code supports. The leader waits for every member to
    // report a capability before it turns on what depends on it.
    repeated string capabilities = 8;
    // The sender's Raft applied index, from a manager. The leader promotes a
    // joining manager to voter only once this shows its Raft has caught up:
    // a node whose Raft port the leader cannot reach heartbeats over gRPC all
    // the same, and as a voter it would cost the cluster its quorum.
    optional uint64 raft_applied_index = 9;
}

message HeartbeatPong {
    string leader_id = 1;
    int64  timestamp = 2;
    // Where an agent should send its heartbeats, and the managers it accepts
    // requests from. from_leader says whether this pong came from the leader
    // (authoritative) or from a follower whose list may lag. A manager older
    // than these fields leaves all three empty.
    string leader_grpc_address = 3;
    repeated NodeInfo managers = 4;
    bool   from_leader = 5;
}

message APIRequest {
    string method = 1;
    string path = 2;
    bytes  body = 3;
    map<string, string> headers = 4;
    string auth_token = 5;
}

message APIResponse {
    int32  status_code = 1;
    bytes  body = 2;
    map<string, string> headers = 3;
}

message MetricsRequest {
    string node_id = 1;
}

message MetricsResponse {
    string node_id = 1;
    double cpu_percent = 2;
    double memory_percent = 3;
    double disk_percent = 4;
    int32  container_count = 5;
    int64  uptime_seconds = 6;
}

message SubscribeRequest {
    string node_id = 1;
    repeated string event_types = 2;
}

message ClusterEvent {
    string event_type = 1;
    string node_id = 2;
    string detail = 3;
    int64  timestamp = 4;
}

message NodeInfo {
    string id = 1;
    string name = 2;
    string api_address = 3;
    string grpc_address = 4;
    string role = 5;
    string status = 6;
    string kind = 7;           // "manager" or "agent"
}

message RegisterAgentRequest {
    string token = 1;
    bytes  csr = 2;            // DER PKCS#10 for an ECDSA P-256 key made on the agent
    string node_name = 3;
    string api_address = 4;    // advertise:panel_port
    string grpc_address = 5;   // advertise:grpc_port
    bytes  panel_ca_cert = 6;  // PEM: the CA of the agent panel's HTTPS certificate
    string version = 7;
}

message RegisterAgentResponse {
    bool   success = 1;
    string error = 2;
    string node_id = 3;
    bytes  node_cert = 4;      // PEM, OU=sfpanel-agent, CN=node_id
    bytes  ca_cert = 5;        // PEM, the cluster CA
    string agent_key = 6;      // this agent's own internal-proxy key; nothing else
    repeated NodeInfo managers = 7;
    string cluster_name = 8;
    string leader_grpc_address = 9; // set when the answering manager is not the leader
}

message ReportPanelCARequest {
    bytes ca_cert = 1;         // PEM
}

message ReportPanelCAResponse {
    bool   success = 1;
    string error = 2;
    string leader_grpc_address = 3;
}
